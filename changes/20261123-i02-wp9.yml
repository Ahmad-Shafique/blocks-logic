type: changed
breaking: false
summary: The certificate upload (CertificateStorageService) now stores the certificate through the tenant's Default storage configuration, with IStorageService.UploadPublicObjectAsync, instead of building its own Azure BlobContainerClient from a connection string, so it works on an S3 or S3-compatible Default configuration too (a bucket policy on the shared certificates bucket gives the permanent public read). IStorageService and its Azure, AWS, S3-compatible and SFTP implementations gain UploadPublicObjectAsync(container, key, stream, contentType) and OpenReadAsync(container, key); SFTP answers with a clear not-supported error (storage -> public_objects_not_supported). The certificates container and blob names are unchanged, so URLs already stored keep working.
